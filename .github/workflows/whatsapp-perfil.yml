name: PhoneOSINT - Consulta sem chave

# Um unico workflow manual, sem API key e sem enviar mensagens.
# Inputs do GitHub Actions NAO sao secretos.
run-name: Teste de numero no PhoneOSINT

on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Seu numero brasileiro com DDD (campo nao secreto)'
        required: false
        type: string
      confirmo_numero_meu:
        description: 'Este e meu numero ou tenho autorizacao para testa-lo'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar projeto
        run: python -m unittest discover -s tests -v
      - name: Verificar telefone sem chave ou envio de mensagens
        env:
          PHONE_INPUT: ${{ inputs.numero }}
          PHONE_SECRET: ${{ secrets.PHONE_NUMBER }}
          AUTHORIZED: ${{ inputs.confirmo_numero_meu }}
        shell: bash
        run: |
          python -c "from associated_names import workflow_main; workflow_main()"
