name: PhoneOSINT - Consulta de numero real

# Um unico workflow na main, sem simulacoes nem acessos a dados vazados.
# workflow_dispatch inputs NAO sao secretos; prefira o segredo PHONE_NUMBER.
on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Seu numero com DDD (campo NAO secreto; prefira segredo PHONE_NUMBER)'
        type: string
        required: false
      confirmo_numero_meu:
        description: 'Confirmo que sou o titular ou usuario autorizado do numero'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  pesquisa-real:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Consultar seu numero e mostrar fontes reais
        env:
          PHONE_INPUT: ${{ inputs.numero }}
          PHONE_SECRET: ${{ secrets.PHONE_NUMBER }}
          AUTHORIZED: ${{ inputs.confirmo_numero_meu }}
        shell: bash
        run: |
          python -c "from associated_names import workflow_main; workflow_main()"
