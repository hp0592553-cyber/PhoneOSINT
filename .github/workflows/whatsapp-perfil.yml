name: PhoneOSINT - Nome por numero (teste)

# Um unico workflow na main. Simulacao nao acessa vazamentos reais.
# Inputs workflow_dispatch NAO sao secretos.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo do teste'
        type: choice
        required: true
        default: 'simulacao'
        options:
          - simulacao
          - meu_numero
      numero:
        description: 'No modo meu_numero: telefone com DDD (input nao secreto)'
        type: string
        required: false
      confirmo_numero_meu:
        description: 'Confirmo autorizacao para testar o telefone informado'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Simular cruzamento de registros ficticios
        if: ${{ inputs.modo == 'simulacao' }}
        run: |
          python demo_crosscheck.py >> "$GITHUB_STEP_SUMMARY"
          echo "Simulacao concluida sem dados pessoais reais."
      - name: Validar numero proprio sem acessar bases privadas
        if: ${{ inputs.modo == 'meu_numero' }}
        env:
          PHONE_INPUT: ${{ inputs.numero }}
          PHONE_SECRET: ${{ secrets.PHONE_NUMBER }}
          AUTHORIZED: ${{ inputs.confirmo_numero_meu }}
        run: python -c "from associated_names import workflow_main; workflow_main()"
