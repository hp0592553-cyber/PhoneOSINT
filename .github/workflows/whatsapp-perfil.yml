name: PhoneOSINT - Nome por numero

# Unico workflow de teste de nomes associados. Nenhuma busca privada.
# Inputs do Run workflow NAO sao secretos.
run-name: Nome associado ao telefone - teste autorizado

on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Numero com DDD (input nao secreto; prefira secret PHONE_NUMBER)'
        required: false
        type: string
      confirmo_numero_meu:
        description: 'Confirmo que o numero e meu ou tenho autorizacao para consulta'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nome-por-numero:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testar validacao e registro de nomes
        run: python -m unittest discover -s tests -v
      - name: Verificar nome associado por fontes permitidas
        env:
          PHONE_INPUT: ${{ inputs.numero }}
          PHONE_SECRET: ${{ secrets.PHONE_NUMBER }}
          AUTHORIZED: ${{ inputs.confirmo_numero_meu }}
        run: python -c "from associated_names import workflow_main; workflow_main()"
