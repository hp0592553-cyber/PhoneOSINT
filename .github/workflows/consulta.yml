name: PhoneOSINT - consulta autorizada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Consultar numero proprio (segredo PHONE_NUMBER)
        env:
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from phoneosint import analyze
          number = os.environ.get("PHONE_NUMBER", "")
          if not number:
              raise SystemExit("Configure o segredo PHONE_NUMBER no repositorio.")
          result = analyze(number)
          print("Consulta local concluida.")
          print("Tipo:", result["type"])
          print("Regiao:", result["region"])
          print("Titular:", "Nao identificado (sem base autorizada)")
          PY
